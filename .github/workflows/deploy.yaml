name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve runtime API URL
        run: |
          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.rhoddo.com}" >> "$GITHUB_ENV"
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Create production Dockerfile
        run: |
          cat > Dockerfile.deploy <<'EOF'
          FROM node:20-alpine AS deps
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci

          FROM node:20-alpine AS builder
          WORKDIR /app
          ARG NEXT_PUBLIC_API_URL
          ENV NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
          COPY --from=deps /app/node_modules ./node_modules
          COPY . .
          RUN npm run build

          FROM node:20-alpine AS runner
          WORKDIR /app
          ENV NODE_ENV=production
          ENV PORT=3002
          ARG NEXT_PUBLIC_API_URL
          ENV NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY --from=builder /app/public ./public
          COPY --from=builder /app/.next ./.next
          COPY --from=builder /app/next.config.mjs ./next.config.mjs
          EXPOSE 3002
          CMD ["npm", "run", "start"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The server is ARM, so the image is built under QEMU emulation. Node sometimes crashes
      # there ("qemu: uncaught target signal 4 (Illegal instruction)") depending on the GitHub
      # machine, so a failed build is tried again, up to 3 times, before the job fails.
      - name: Build ARM64 image and export
        run: |
          for attempt in 1 2 3; do
            if docker buildx build \
              --platform linux/arm64 \
              --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
              --tag rhoddo-web:latest \
              --output type=docker,dest=rhoddo-web.tar \
              -f Dockerfile.deploy \
              .; then
              exit 0
            fi
            echo "Build attempt $attempt failed. Trying again..."
            sleep 10
          done
          echo "The image failed to build 3 times."
          exit 1

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer image to server
        run: |
          scp rhoddo-web.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/rhoddo-web.tar

      # This file is rewritten on every deploy, so every setting the site needs goes here.
      # WEB_PROXY_KEY must be the same secret value as in the rhoddo-api repo (src/lib/forwardClient.ts).
      - name: Write environment file on server
        env:
          WEB_PROXY_KEY: ${{ secrets.WEB_PROXY_KEY }}
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            mkdir -p /home/${{ secrets.SERVER_USER }}/rhoddo-web
            cat > /home/${{ secrets.SERVER_USER }}/rhoddo-web/.env << 'ENVFILE'
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          WEB_PROXY_KEY=${WEB_PROXY_KEY}
          ENVFILE
          EOF

      - name: Deploy on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            docker load -i /tmp/rhoddo-web.tar
            docker stop rhoddo-web || true
            docker rm rhoddo-web || true
            docker run -d \
              --name rhoddo-web \
              --network waglogy-net \
              --restart unless-stopped \
              --env-file /home/${{ secrets.SERVER_USER }}/rhoddo-web/.env \
              -p 3002:3002 \
              rhoddo-web:latest
            rm /tmp/rhoddo-web.tar
          EOF